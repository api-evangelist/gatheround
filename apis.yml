aid: gatheround
name: Gatheround
description: >-
  Gatheround (formerly Icebreaker) is a video meeting platform for engaging,
  interactive, and inclusive virtual gatherings — team all-hands, onboarding,
  workshops, learning sessions, and community events. It layers structured
  agendas, breakout rooms, group shares, Q&A, polls, quizzes, and photo booths
  on top of video, with recording, moderation, upvoting, and ready-made
  templates aimed at people-operations, community, and team leaders. Founded in
  2018 and backed by Bloomberg Beta and Salesforce Ventures, Gatheround was
  acquired by Donut in December 2024. The company publishes no public API or
  developer platform; this profile captures its public web presence and probed
  domain-security posture.
